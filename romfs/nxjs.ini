[v8]
jit = auto
# RPG Maker MV is pure JavaScript: it never compiles WebAssembly. Dropping the
# wasm code headroom keeps the JIT code arena at its 64 MiB minimum instead of
# reserving an extra dual-mapped 64 MiB (~128 MiB of real RAM), leaving that
# memory available to the V8 heap and native buffers.
wasm = off
flags = --expose-gc

[memory]
# Claim the largest heap nx.js allows (hard runtime cap: 512 MiB) up front —
# the Switch's application-mode memory grant is far larger than that, so the
# loader takes as much as the runtime can give it in one shot, like the
# one-time heap reservation in a native homebrew main.c.
heap_limit = 512MiB

[renderer]
mode = auto

[threadpool]
size = 4
stack_size = 1MiB
